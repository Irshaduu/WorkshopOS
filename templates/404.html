<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <style>
        body { background: #f3f4f6; color: #1e293b; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; font-family: system-ui, -apple-system, sans-serif; }
        .error-card { background: white; padding: 3rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); max-width: 500px; width: 90%; }
        h1 { font-size: 5rem; font-weight: 800; color: #3b82f6; margin-bottom: 0; }
        h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; color: #334155; }
        p { color: #64748b; margin-bottom: 2rem; }
        .btn {
            display: inline-block; padding: 0.5rem 1.5rem;
            border-radius: 0.375rem; border: 1px solid transparent;
            font-weight: 500; line-height: 1.5; text-decoration: none;
            background: #0d6efd; color: #fff; transition: background .15s ease-in-out;
        }
        .btn:hover { background: #0b5ed7; }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="/" class="btn">Go to Dashboard</a>
    </div>
</body>
</html>
